name: Diagnose lanes

# Checks lane match quality on the real Greater London data. Prints a report only; builds nothing
# that is published.

on:
  push:
    paths:
      - '.github/workflows/diagnose-lanes.yml'
      - 'tools/diagnose-lanes.mjs'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download the Greater London extract
        run: |
          URL=$(node tools/geofabrik-url.mjs greater-london)
          echo "extract: $URL"
          curl -fL --retry 5 --retry-all-errors --retry-delay 10 -o london.osm.pbf "$URL"
          ls -l london.osm.pbf

      - name: Extract lane ways
        run: node --max-old-space-size=6000 tools/osm-extract.mjs --pbf=london.osm.pbf --name=london --bbox=-0.55,51.28,0.30,51.70

      - name: Fetch the map tiles
        run: node tools/fetch-tiles.mjs --bbox=-0.55,51.28,0.30,51.70 --zoom=14

      - name: Diagnose lane matching
        shell: bash
        run: |
          set -o pipefail
          node --max-old-space-size=8000 tools/diagnose-lanes.mjs --name=london --bbox=-0.55,51.28,0.30,51.70 --zoom=14 | tee diagnose.txt
# rerun after a transient Geofabrik error
