name: Test the turn restriction fetch

# Manual check that the Overpass API can be reached from GitHub's runners, and that
# the fetch and parse steps work on a real London bounding box. Uploads the summary
# and the parsed restriction file as artifacts. Does not publish anything.

on:
  push:
    branches: [ccr-8fafbdec-2zz0bp]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the fetch for Greater London
        run: node --max-old-space-size=6000 tools/fetch-restrictions.mjs --name=london --bbox=-0.55,51.28,0.30,51.70 | tee fetch-summary.txt

      - name: Save the summary and the parsed file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restrictions-london
          path: |
            fetch-summary.txt
            data/cache/restrictions/london.json
          if-no-files-found: warn
