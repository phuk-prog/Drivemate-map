name: UK original tiled routing acceptance
on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Completed national compiler Actions run ID
        required: true
        default: '45458730102'
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CANDIDATE: ${{ inputs.candidate_run }}
    steps:
      - uses: actions/checkout@v4
      - name: Require successful immutable national candidate
        run: |
          set -euo pipefail
          [[ "$CANDIDATE" =~ ^[0-9]+$ ]]
          test "$(gh run view "$CANDIDATE" --json conclusion --jq .conclusion)" = success
          mkdir -p candidate
          gh run download "$CANDIDATE" --name UK-DriveMate-routing-tiles-NOT-ROAD-VALIDATED --dir candidate
          test -s candidate/routing.dma
          test -s candidate/manifest.json
      - name: Verify national archive and derive directed cell lower bounds
        run: python3 tools/enrich_dmtiles_catalog.py --manifest candidate/manifest.json --archive candidate/routing.dma --out candidate/manifest-enriched.json
      - name: Run real UK engineering route and offline deviation benchmarks
        run: python3 tools/benchmark_dmtiles_uk.py --manifest candidate/manifest-enriched.json --archive candidate/routing.dma --report national-acceptance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UK-DriveMate-national-acceptance
          path: |
            national-acceptance.json
            candidate/manifest-enriched.json
          if-no-files-found: warn
