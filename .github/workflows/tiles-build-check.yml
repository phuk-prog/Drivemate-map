name: Map tiles build check (Planetiler, real region, no publish)

# Builds the Stockport map tiles as one PMTiles file from the real Greater Manchester extract,
# using Planetiler (open-source, Apache 2.0). Keeps the file as a run artifact. Publishes nothing.

on:
  workflow_dispatch:
  push:
    branches: [category-3-map-drawing]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download the Greater Manchester extract (Geofabrik index, bounded retries)
        run: |
          mkdir -p data/osm data/planetiler
          URL=$(node tools/geofabrik-url.mjs greater-manchester)
          echo "Extract: $URL"
          curl -fsSL --retry 4 --retry-delay 20 --retry-all-errors -o data/osm/greater-manchester.osm.pbf "$URL"
          ls -l data/osm/greater-manchester.osm.pbf

      - name: Download Planetiler
        run: |
          URL=$(curl -fsSL https://api.github.com/repos/onthegomap/planetiler/releases/latest | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);const a=r.assets.find(x=>x.name==="planetiler.jar");console.log(a.browser_download_url)})')
          echo "Planetiler: $URL"
          curl -fsSL -o data/planetiler/planetiler.jar "$URL"
          java -jar data/planetiler/planetiler.jar --help 2>&1 | head -5 || true

      - name: Build Stockport PMTiles (zoom 0 to 14)
        run: |
          java -Xmx6g -jar data/planetiler/planetiler.jar \
            --osm-path=data/osm/greater-manchester.osm.pbf \
            --bounds=-2.25,53.34,-2.07,53.46 \
            --minzoom=0 --maxzoom=14 \
            --output=data/planetiler/stockport.pmtiles \
            --download --force 2>&1 | tee build-report.txt
          ls -l data/planetiler/stockport.pmtiles

      - name: Check the tiles read back and list the layers
        run: |
          npm install --no-save pmtiles@3
          node tools/pmtiles-check.mjs data/planetiler/stockport.pmtiles | tee -a build-report.txt

      - uses: actions/upload-artifact@v4
        with:
          name: stockport-pmtiles
          path: |
            data/planetiler/stockport.pmtiles
            build-report.txt
          retention-days: 7
