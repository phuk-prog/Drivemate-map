name: Update map regions

on:
  schedule:
    # Four runs a day, at slightly off-peak minutes.
    - cron: "17 1,7,13,19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-maps
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The OSM data for growing outwards (a whole Geofabrik extract, about 2 GB to download) is prepared once a
      # week and kept between runs, instead of being downloaded four times a day.
      - name: Week of the year, for the OSM data kept between runs
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore this week's OSM data
        id: osm
        uses: actions/cache/restore@v4
        with:
          path: data/osm-cache
          key: osm-cache-${{ steps.week.outputs.week }}

      - name: Build new and changed regions, and grow outwards
        env:
          MAX_REGIONS_PER_RUN: "2"
          MAX_SQUARES_PER_RUN: "100"
          MAX_SQUARES_CHECKED_PER_RUN: "400"
          TRUST_INDEX: "1"
        run: node --max-old-space-size=8000 tools/update-regions.mjs

      - name: Keep this week's OSM data for the next runs
        if: steps.osm.outputs.cache-hit != 'true' && hashFiles('data/osm-cache/**') != ''
        uses: actions/cache/save@v4
        with:
          path: data/osm-cache
          key: osm-cache-${{ steps.week.outputs.week }}

      - name: Test every published map file
        run: node --max-old-space-size=8000 tools/test-map.mjs

      # The index is staged here but not committed or pushed until the release upload has succeeded.
      - name: Check whether the index changed
        id: changes
        run: |
          git add data/published/index.json data/published/squares/index.json regions.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new or changed map data. Nothing to publish."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compress square files for faster phone downloads
        run: |
          shopt -s nullglob   # no square built in this run: the loop does nothing, instead of failing on the literal pattern
          for f in data/published/squares/*.dmap; do gzip -9 -c "$f" > "$f.gz"; done

      - name: Publish map files to their releases
        if: steps.changes.outputs.changed == 'true' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # data/out/uploads.tsv lists every file this run built and its release: maps-latest for regions and the
          # fixed square areas, squares-<1 degree block> for squares the map grew into. Each .dmap goes with its .dmap.gz.
          # A run that only passed over squares with no roads has nothing to upload, but still commits how far it got.
          if [ ! -s data/out/uploads.tsv ]; then
            echo "No new map files in this run."
            exit 0
          fi
          for tag in $(cut -f1 data/out/uploads.tsv | sort -u); do
            files=()
            while IFS=$'\t' read -r t f; do
              [ "$t" = "$tag" ] || continue
              files+=("$f")
              if [ -f "$f.gz" ]; then files+=("$f.gz"); fi
            done < data/out/uploads.tsv
            if ! gh release view "$tag" >/dev/null 2>&1; then
              if [ "$tag" = "maps-latest" ]; then
                gh release create maps-latest --title "Drivemate map regions (latest)" \
                  --notes "Automatically updated map regions. Each file replaces the previous version." --latest=false
              else
                gh release create "$tag" --title "Drivemate map squares ${tag#squares-}" \
                  --notes "Map squares in this 1 degree block, added as the map grows outwards from Stockport. Each file replaces the previous version." --latest=false
              fi
            fi
            echo "Uploading ${#files[@]} file(s) to $tag"
            gh release upload "$tag" "${files[@]}" --clobber
          done

      # Runs only after the upload above has succeeded. A failed build, test, compress or upload stops the
      # job before this step, so the index on the branch never names files the release does not have.
      - name: Commit index and push
        if: steps.changes.outputs.changed == 'true' && github.ref_name == 'main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update map index ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push origin HEAD:${GITHUB_REF_NAME}
