name: Update map regions

on:
  schedule:
    # Four runs a day, at slightly off-peak minutes.
    - cron: "17 1,7,13,19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-maps
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build new and changed regions
        env:
          MAX_REGIONS_PER_RUN: "2"
        run: node --max-old-space-size=8000 tools/update-regions.mjs

      - name: Test every published map file
        run: node --max-old-space-size=8000 tools/test-map.mjs

      - name: Commit index only if something changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/published/index.json regions.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new or changed map data. Nothing to publish."
            exit 0
          fi
          git commit -m "Update map index ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push origin HEAD:${GITHUB_REF_NAME}
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish map files to the maps-latest release
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view maps-latest >/dev/null 2>&1 || \
            gh release create maps-latest --title "Drivemate map regions (latest)" \
              --notes "Automatically updated map regions. Each file replaces the previous version." --latest=false
          gh release upload maps-latest data/published/*.dmap --clobber
