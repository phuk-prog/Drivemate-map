name: Candidate UK Valhalla graph for interchangeable routing

on:
  workflow_dispatch:
  # One-time full-UK bootstrap is triggered by merging the dedicated request
  # file; normal daily source checks do not rebuild a multi-GB graph.
  push:
    branches: [main]
    paths:
      - 'requests/uk-valhalla-bootstrap.json'
  pull_request:
    paths:
      - '.github/workflows/build-uk-valhalla.yml'
      - 'tools/build_valhalla_graph.sh'
      - 'tools/package_valhalla_tiles.py'
      - 'tools/test_package_valhalla_tiles.py'
      - 'tools/verify_valhalla_release.py'
      - 'tools/test_verify_valhalla_release.py'
      - 'tools/probe_valhalla_graph.py'
      - 'tools/test_probe_valhalla_graph.py'
      - 'tools/restore_uk_valhalla.py'
      - 'tools/test_restore_uk_valhalla.py'
      - 'tools/smoke_valhalla_http.py'
      - 'tools/test_smoke_valhalla_http.py'
      - 'deploy/uk-valhalla/**'

permissions:
  contents: read

# First native UK graph build is explicit, not three expensive builds per day.
concurrency:
  group: candidate-uk-valhalla-${{ github.event_name == 'pull_request' && github.head_ref || 'publication' }}
  cancel-in-progress: false

jobs:
  test:
    name: Validate candidate UK Valhalla graph packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test reproducible package and source policies
        run: |
          bash -n tools/build_valhalla_graph.sh
          python3 -m unittest discover -s tools -p 'test_*valhalla*.py' -v

  build:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Free room for UK source and native Valhalla graph
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Restore and verify immutable UK Geofabrik source
        run: python3 tools/uk_restore_for_tiles.py --dest cache
      - name: Build native Valhalla UK graph tiles
        run: bash tools/build_valhalla_graph.sh
      - name: Verify five real UK driving journeys on native Valhalla tiles
        run: python3 tools/probe_valhalla_graph.py --report valhalla-output/route-probes.json
      - name: Preserve native UK route QA evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-valhalla-uk-route-probes
          path: valhalla-output/route-probes.json
          retention-days: 30
          if-no-files-found: warn
      - name: Split graph extract into immutable SHA-256 release parts
        run: python3 tools/package_valhalla_tiles.py --tar valhalla-output/tiles.tar --source-metadata cache/source-release.json --output valhalla-package
      - name: Publish immutable experimental Valhalla graph
        run: |
          set -euo pipefail
          source_tag=$(python3 -c 'import json;print(json.load(open("valhalla-package/uk-valhalla-manifest.json"))["source_tag"])')
          builder=$(python3 -c 'import json;print(json.load(open("valhalla-package/uk-valhalla-manifest.json"))["builder_sha256"][:12])')
          suffix=$(echo "$source_tag" | sed 's/^uk-map-//')
          # A failed draft can retain the original source/builder tag. Give
          # every attempt an immutable run identity rather than overwriting it.
          tag="valhalla-$suffix-b$builder-run$GITHUB_RUN_ID"
          # GitHub's /releases/tags/{tag} endpoint returns 404 for some draft
          # releases even though /releases/{id} lists them. Resolve by id.
          release_id_for_tag() {
            gh api "repos/$GH_REPO/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"$tag\") | .id"
          }
          if [ -n "$(release_id_for_tag)" ]; then
            echo "Refusing to overwrite immutable Valhalla release $tag"
            exit 1
          fi
          printf "UK Valhalla graph from pinned %s.\n" "$source_tag" > valhalla-package/notes.md
          printf "© OpenStreetMap contributors, ODbL 1.0. NOT ROAD VALIDATED.\n" >> valhalla-package/notes.md
          printf "Requires compatible Android Valhalla Mobile integration and UK route acceptance.\n" >> valhalla-package/notes.md
          # Keep the Release private to GitHub maintainers until every asset
          # exists with its expected length. Incomplete uploads remain draft.
          gh release create "$tag" valhalla-package/uk-valhalla-manifest.json \
            valhalla-package/uk-valhalla-tiles.tar.part-* \
            --repo "$GH_REPO" --title "Candidate UK Valhalla routing $tag" \
            --notes-file valhalla-package/notes.md --draft --prerelease --target "$GITHUB_SHA"
          # A draft must be verified through its release ID. The validator
          # refuses publication unless every multipart asset is uploaded.
          release_id=""
          for attempt in 1 2 3 4 5; do
            release_id="$(release_id_for_tag)"
            [ -n "$release_id" ] && break
            sleep 2
          done
          test -n "$release_id" || { echo "Draft release ID unavailable"; exit 1; }
          gh api "repos/$GH_REPO/releases/$release_id" |
            python3 tools/verify_valhalla_release.py \
              --manifest valhalla-package/uk-valhalla-manifest.json
          gh api -X PATCH "repos/$GH_REPO/releases/$release_id" \
            -F draft=false -F prerelease=true >/dev/null
          gh api "repos/$GH_REPO/releases/$release_id" --jq '.assets[].name'
