name: Recover failed UK source check on a fresh runner

# Bounded recovery on a different hosted runner for the single source check.
# Never re-run a failed test or tile-publishing stage, or untrusted PR code.
on:
  workflow_run:
    workflows: [Publish UK map data to GitHub Releases]
    types: [completed]

permissions:
  contents: read
  actions: write

concurrency:
  group: uk-source-recovery-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.run_attempt < 3 &&
      github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Verify failed job and rerun only source check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 tools/uk_retry_source.py
