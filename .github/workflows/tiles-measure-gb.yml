name: Map tiles measurement (Great Britain, no publish)

# Measures how long a Planetiler build of the whole of Great Britain takes on a GitHub runner, how much
# memory and disk it uses, and how big the PMTiles file is. Publishes nothing. Used to plan the UK regions.

on:
  workflow_dispatch:
  push:
    branches: [category-3-map-drawing]

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Record the runner's resources
        run: |
          nproc
          free -h
          df -h /

      - name: Download the Great Britain extract
        run: |
          mkdir -p data/osm data/planetiler
          URL=$(node tools/geofabrik-url.mjs great-britain)
          echo "Extract: $URL"
          start=$(date +%s)
          curl -fsSL --retry 4 --retry-delay 20 --retry-all-errors -o data/osm/great-britain.osm.pbf "$URL"
          echo "download seconds: $(( $(date +%s) - start ))"
          ls -l data/osm/great-britain.osm.pbf

      - name: Download Planetiler
        run: |
          URL=$(curl -fsSL https://api.github.com/repos/onthegomap/planetiler/releases/latest | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);const a=r.assets.find(x=>x.name==="planetiler.jar");console.log(a.browser_download_url)})')
          curl -fsSL -o data/planetiler/planetiler.jar "$URL"

      - name: Build Great Britain PMTiles (zoom 0 to 14), timed
        run: |
          start=$(date +%s)
          java -Xmx12g -jar data/planetiler/planetiler.jar \
            --osm-path=data/osm/great-britain.osm.pbf \
            --bounds=-8.7,49.8,1.8,60.9 \
            --minzoom=0 --maxzoom=14 \
            --output=data/planetiler/great-britain.pmtiles \
            --download --force 2>&1 | tee build-report-gb.txt
          echo "build seconds: $(( $(date +%s) - start ))" | tee -a build-report-gb.txt
          ls -l data/planetiler/great-britain.pmtiles | tee -a build-report-gb.txt

      - name: Record the disk and memory after the build
        run: |
          free -h
          df -h /

      - uses: actions/upload-artifact@v4
        with:
          name: great-britain-measurement
          path: |
            build-report-gb.txt
          retention-days: 7
